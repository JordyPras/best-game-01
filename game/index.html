<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberhold — Defend the Last Ember</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04060f;
  }
  #game {
    position: fixed;
    display: block;
    touch-action: none;
    image-rendering: auto;
    box-shadow: 0 0 60px rgba(255, 154, 60, 0.12);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberhold: move with WASD, aim with the mouse, shoot with click, dash with Space. Survive ten waves and defeat The Hollow."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
